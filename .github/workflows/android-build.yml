name: Android CI

on:
  push:
    paths:
      - 'toza_mobile/**'
  pull_request:
    paths:
      - 'toza_mobile/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --install "platform-tools" "cmdline-tools;latest" "platforms;android-36" "build-tools;36.0.0"

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: |
          cd toza_mobile
          flutter pub get

      - name: Static analyze
        run: |
          cd toza_mobile
          flutter analyze

      - name: Run tests
        run: |
          cd toza_mobile
          flutter test --coverage

      - name: Build debug APK
        run: |
          cd toza_mobile
          flutter build apk --debug --no-shrink

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: toza_mobile-app-debug
          path: toza_mobile/build/app/outputs/flutter-apk/app-debug.apk
